<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo A - 夏夜流萤</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0e1a;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .label {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(240, 235, 227, 0.5);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="label">方案 A：夏夜流萤</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const particles = [];
        const count = 60;

        class Firefly {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.r = Math.random() * 2.5 + 1;
                this.baseAlpha = Math.random() * 0.4 + 0.3;
                this.alpha = this.baseAlpha;
                this.phase = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.3 + 0.1;
                this.angle = Math.random() * Math.PI * 2;
                this.driftX = (Math.random() - 0.5) * 0.3;
                this.driftY = (Math.random() - 0.5) * 0.3;
            }
            update(time) {
                this.x += Math.cos(this.angle) * this.speed + this.driftX;
                this.y += Math.sin(this.angle) * this.speed + this.driftY;
                this.angle += (Math.random() - 0.5) * 0.02;
                
                // 呼吸闪烁
                this.alpha = this.baseAlpha + Math.sin(time * 0.001 + this.phase) * 0.2;
                
                if (this.x < -50 || this.x > w + 50 || this.y < -50 || this.y > h + 50) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = this.r * 6;
                ctx.shadowColor = 'rgba(240, 230, 140, 0.8)';
                ctx.fillStyle = '#f0e68c';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < count; i++) particles.push(new Firefly());

        function animate(time) {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.update(time);
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate(0);
    </script>
</body>
</html>
